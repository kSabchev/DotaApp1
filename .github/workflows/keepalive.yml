# Keeps the free-tier Render backend awake by pinging its health endpoint.
# Render free instances sleep after ~15 minutes without traffic and take
# 20-60 s to wake; a ping every 12 minutes prevents that. One always-on
# service fits inside Render's 750 free instance-hours per month (~744 h).
#
# Notes:
# - GitHub schedules are best-effort (runs can be delayed a few minutes);
#   the frontend's own wake-up handling covers any gap.
# - GitHub disables scheduled workflows after 60 days without repo activity —
#   a commit or a manual "Run workflow" click re-enables it.
name: Keep backend awake

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "https://dotaapp1.onrender.com/api/health")
          echo "Health responded with HTTP $code"
          test "$code" = "200"
